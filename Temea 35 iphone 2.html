    <style>

            padding: 24px 20px 30px;
        }
        .header {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: space-between;
            border-bottom: 3px solid #1e3a5f;
            padding-bottom: 12px;
            margin-bottom: 20px;
        }
        .header-left h1 { font-size: 28px; font-weight: 700; color: #1e3a5f; }
        .header-left .sub { font-size: 16px; color: #64748b; font-weight: 500; }
        .tabs {
            display: flex;
            gap: 4px;
            border-bottom: 2px solid #e2e8f0;
            padding-bottom: 6px;
            margin-bottom: 24px;
            flex-wrap: wrap;
        }
        .tab-btn {
            background: transparent;
            border: none;
            padding: 10px 18px;
            font-weight: 600;
            font-size: 14px;
            color: #4a5b6e;
            border-radius: 40px;
            cursor: pointer;
        }
        .tab-btn.active {
            background: #1e3a5f;
            color: white;
        }
        .tab-content { display: none; }
        .tab-content.active { display: block; }

            border-radius: 18px;

        .resum-box ul, .resum-box ol { margin-left: 22px; margin-bottom: 12px; line-height: 1.7; }
        .resum-box table { width: 100%; border-collapse: collapse; margin: 12px 0; font-size: 14px; }
        .resum-box th, .resum-box td { border: 1px solid #e2e8f0; padding: 8px 12px; text-align: left; }
        .resum-box th { background: #e0e8f0; font-weight: 600; }
        .resum-box .destacat { background: #eef5ff; padding: 12px 18px; border-radius: 12px; border-left: 4px solid #1e3a5f; margin: 14px 0; }

        .question-text { font-size: 18px; font-weight: 500; margin-bottom: 14px; }
        .options { display: flex; flex-direction: column; gap: 10px; margin-bottom: 12px; }
        .option { background: #f8fafc; border: 2px solid #e2e8f0; border-radius: 14px; padding: 14px 18px; cursor: pointer; }
        .option.correct { border-color: #2b6e3b; background: #e6f2ea; }
        .option.wrong { border-color: #b33c3c; background: #fde8e8; }
        .option.disabled { pointer-events: none; opacity: 0.7; }
        .justificacio-box { background: #eef5ff; border-left: 4px solid #1e3a5f; padding: 12px 16px; border-radius: 8px; margin: 6px 0 16px 0; display: none; }
        .justificacio-box.visible { display: block; }
        .nav-buttons { display: flex; justify-content: space-between; flex-wrap: wrap; gap: 10px; margin-top: 8px; }
        .btn { background: #eef2f6; border: none; padding: 12px 24px; border-radius: 40px; font-weight: 600; font-size: 14px; cursor: pointer; }
        .btn-primary { background: #1e3a5f; color: white; }
        .btn-outline { background: transparent; border: 2px solid #cbd5e1; }
        .btn:disabled { opacity: 0.5; pointer-events: none; }

        /* Mini flashcards */
        .flashcard { background: #f8fafc; border: 2px solid #e2e8f0; border-radius: 24px; padding: 30px 20px; text-align: center; min-height: 180px; cursor: pointer; margin-bottom: 16px; }

        .flashcard-controls { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; }
        .flash-filters { display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; margin: 12px 0; }
        .flash-mode-selector { display: flex; gap: 8px; justify-content: center; margin-bottom: 16px; }

        .export-box textarea { width: 100%; height: 180px; font-family: monospace; border: 2px solid #e2e8f0; border-radius: 12px; padding: 12px; resize: vertical; }
        .stat-card { display: inline-block; margin: 4px 8px; }
        .stat-bar { background: #e2e8f0; border-radius: 20px; height: 12px; overflow: hidden; margin: 12px 0; }
        .stat-bar .fill { height: 100%; background: #2b6e3b; border-radius: 20px; }

        @media (max-width: 640px) { .container { padding: 16px; } .header-left h1 { font-size: 22px; } }
    </style>
</head>

    function shuffleArray(arr) {
        var a = arr.slice(0);
        for (var i = a.length - 1; i > 0; i--) {
            var j = Math.floor(Math.random() * (i + 1));
            var temp = a[i];
            a[i] = a[j];
            a[j] = temp;
        }
        return a;
    }

    function shuffleOptions(pregunta) {
        var opts = [];
        for (var i = 0; i < pregunta.opcions.length; i++) {
            opts.push({ text: pregunta.opcions[i], originalIdx: i });
        }
        var shuffled = shuffleArray(opts);
        var newOpcions = [];
        for (var j = 0; j < shuffled.length; j++) {
            newOpcions.push(shuffled[j].text);
        }
        var newCorrecta = 0;
        for (var k = 0; k < shuffled.length; k++) {
            if (shuffled[k].originalIdx === pregunta.correcta) {
                newCorrecta = k;
                break;
            }
        }
        return {
            id: pregunta.id,
            pregunta: pregunta.pregunta,
            opcions: newOpcions,
            correcta: newCorrecta,
            justificacio: pregunta.justificacio,
            mnemotecnic: pregunta.mnemotecnic || null
        };
    }

    function prepararPreguntes(arr) {
        var result = [];
        for (var i = 0; i < arr.length; i++) {
            result.push(shuffleOptions(arr[i]));
        }
        return result;
    }

            var key = 'tema35_data';

                        this.simState[2].favorite = data.favorites.sim2 || [];
                        this.simState[3].favorite = data.favorites.sim3 || [];
                    }
                } catch(e) {}
            }
        },

            var key = 'tema35_data';

                this.showResult(container, preg, state.answers, num);
                return;
            }

            var q = preg[idx];

        seleccionarOpcio: function(num, idx, val) {
            var state = this.simState[num];
            if (state.finished) return;
            if (state.answers[idx] !== undefined) return;
            state.answers[idx] = val;
            this.renderSimulacre(num);
        },

        anteriorPregunta: function(num) {
            var state = this.simState[num];
            if (state.current > 0) {
                state.current--;
                this.renderSimulacre(num);
            }
        },

        seguentPregunta: function(num) {
            var state = this.simState[num];
            var preg = state.preguntes;
            var idx = state.current;
            if (state.answers[idx] === undefined) {
                alert('Si us plau, selecciona una opció abans de continuar.');
                return;
            }
            if (idx === preg.length - 1) {
                state.finished = true;
                this.renderSimulacre(num);
            } else {
                state.current++;
                this.renderSimulacre(num);
            }
        },

            var idx = state.favorite.indexOf(id);
            if (idx === -1) state.favorite.push(id);
            else state.favorite.splice(idx, 1);
            this.saveState();
            this.renderSimulacre(num);

>' + detall + '</div></div>';

        repassarFallades: function(num) {
            var state = this.simState[num];
            var preg = state.preguntes;
            var falladesIndex = [];
            for (var i = 0; i < preg.length; i++) {
                if (state.answers[i] !== undefined && state.answers[i] !== preg[i].correcta) {
                    falladesIndex.push(i);
                }
            }
            if (falladesIndex.length === 0) { alert('No tens fallades!'); return; }
            var novesPreg = [];
            for (var j = 0; j < falladesIndex.length; j++) {
                var idx = falladesIndex[j];
                var q = preg[idx];
                novesPreg.push({ id: q.id, pregunta: q.pregunta, opcions: q.opcions.slice(), correcta: q.correcta, justificacio: q.justificacio, mnemotecnic: q.mnemotecnic });
            }
            state.preguntes = shuffleArray(novesPreg);
            state.answers = new Array(state.preguntes.length);
            for (var k = 0; k < state.answers.length; k++) state.answers[k] = undefined;
            state.current = 0;
            state.finished = false;
            this.renderSimulacre(num);
        },

        reiniciarSim: function(num) {
            var state = this.simState[num];
            var base;
            if (num === 1) base = temariBase;
            else if (num === 2) base = examenBase;
            else base = trampesBase;
            state.preguntes = shuffleArray(prepararPreguntes(base));
            state.answers = new Array(state.preguntes.length);
            for (var i = 0; i < state.answers.length; i++) state.answers[i] = undefined;
            state.current = 0;
            state.finished = false;
            this.renderSimulacre(num);
        },

                return;

            if (state.index >= cards.length) state.index = 0;

            var q = cards[state.index];
            var flipped = state.flipped;

            var html = '';
            html += '<div class="flash-mode-selector"><button class="btn btn-sm ' + (state.mode === 'temari' ? 'btn-primary' : 'btn-outline') + '" onclick="app.setFlashMode(\'temari\')">📘 Temari</button><button class="btn btn-sm ' + (state.mode === 'examen' ? 'btn-primary' : 'btn-outline') + '" onclick="app.setFlashMode(\'examen\')">📋 Altres Exàmens</button></div>';
            html += '<div style="display:flex; gap:12px; flex-wrap:wrap; justify-content:center; margin-bottom:12px;"><span style="background:#dcfce7; padding:4px 12px; border-radius:30px; color:#166534;">✅ ' + correctCount + '</span><span style="background:#fee2e2; padding:4px 12px; border-radius:30px; color:#991b1b;">❌ ' + wrongCount + '</span><span style="background:#eef2f6; padding:4px 12px; border-radius:30px; color:#475569;">⏳ ' + pendingCount + '</span></div>';
            html += '<div class="flash-filters"><button class="btn btn-sm ' + (state.filter === 'all' ? 'btn-primary' : 'btn-outline') + '" onclick="app.setFlashFilter(\'all\')">Totes</button><button class="btn btn-sm ' + (state.filter === 'wrong' ? 'btn-danger' : 'btn-outline') + '" onclick="app.setFlashFilter(\'wrong\')">❌ Fallades</button><button class="btn btn-sm ' + (state.filter === 'correct' ? 'btn-success' : 'btn-outline') + '" onclick="app.setFlashFilter(\'correct\')">✅ Encertades</button></div>';
            html += '<div class="flashcard-container"><div class="flashcard ' + (flipped ? 'flipped' : '') + '" onclick="app.flipFlashcard()"><div style="width:100%;"><div class="card-label" style="font-size:13px; color:#64748b;">' + (flipped ? 'Resposta' : 'Pregunta') + ' (' + (state.index+1) + '/' + total + ')</div><div class="card-content" style="font-weight:500;">' + (flipped ? resposta : q.pregunta) + '</div>';
            if (flipped) {
                html += '<div style="background:#eef5ff; padding:12px 16px; border-radius:12px; margin-top:12px; text-align:left;"><strong>💡 Explicació:</strong> ' + q.justificacio + '</div>';
                if (q.mnemo || q.mnemotecnic) {
                    html += '<div style="background:#fff8e1; border:2px dashed #d97706; padding:10px 14px; border-radius:12px; margin-top:8px; text-align:left;">🧠 <strong>Regla mnemotècnica:</strong> ' + (q.mnemo || q.mnemotecnic) + '</div>';
                }
            }
            html += '</div></div>';
            html += '<div class="flashcard-controls"><button class="btn btn-outline" onclick="app.flashcardAnterior()" ' + (state.index===0 ? 'disabled' : '') + '>◀ Anterior</button><span class="flashcard-counter">' + (state.index+1) + ' / ' + total + '</span><button class="btn btn-outline" onclick="app.flashcardSeguent()" ' + (state.index===total-1 ? 'disabled' : '') + '>Següent ▶</button><button class="btn btn-primary" onclick="app.flipFlashcard()">🔁 Voltejar</button></div>';
            if (flipped) {
                html += '<div style="display:flex; gap:10px; margin-top:12px; flex-wrap:wrap; justify-content:center;"><button class="btn btn-success" onclick="app.marcarFlashcard(' + q.id + ',\'correct\')" ' + (status==='correct' ? 'disabled' : '') + ' style="background:#2b6e3b; color:white; border:none; padding:10px 20px; border-radius:40px; font-weight:600;">✅ Encertada</button><button class="btn btn-danger" onclick="app.marcarFlashcard(' + q.id + ',\'wrong\')" ' + (status==='wrong' ? 'disabled' : '') + ' style="background:#b33c3c; color:white; border:none; padding:10px 20px; border-radius:40px; font-weight:600;">❌ Fallada</button>';
                if (status !== 'pending') {
                    html += '<button class="btn btn-outline" onclick="app.marcarFlashcard(' + q.id + ',\'pending\')" style="border:2px solid #cbd5e1; background:transparent; padding:10px 20px; border-radius:40px; font-weight:600;">↩️ Desmarcar</button>';
                }
                html += '</div>';
            }
            html += '</div>';

            container.innerHTML = html;
        },

        flipFlashcard: function() {
            this.flashState.flipped = !this.flashState.flipped;
            this.renderFlashcards();
        },

        flashcardAnterior: function() {
            if (this.flashState.index > 0) {
                this.flashState.index--;
                this.flashState.flipped = false;
                this.renderFlashcards();
            }
        },

        flashcardSeguent: function() {
            var total = this.flashState.cards[this.flashState.mode].length;
            if (this.flashState.index < total - 1) {
                this.flashState.index++;
                this.flashState.flipped = false;
                this.renderFlashcards();
            }
        },

        marcarFlashcard: function(id, status) {
            if (status === 'pending') {
                delete this.flashState.status[id];
            } else {
                this.flashState.status[id] = status;
            }
            this.flashState.flipped = false;
            this.saveState();
            this.renderFlashcards();
        },

        setFlashMode: function(mode) {
            this.flashState.mode = mode;
            this.flashState.index = 0;
            this.flashState.flipped = false;
            this.renderFlashcards();
        },

        setFlashFilter: function(filter) {
            this.flashState.filter = filter;
            this.flashState.index = 0;
            this.flashState.flipped = false;
            this.renderFlashcards();
        },

        // ----- EXPORT -----
        renderExport: function() {
            var container = document.getElementById('export');
            var text = '';
            var all = temariBase.concat(examenBase);
            for (var i = 0; i < all.length; i++) {
                var q = all[i];
                var resposta = q.opcions[q.correcta];
                text += q.pregunta + '\t' + resposta + '\n';
            }
            container.innerHTML = '<div class="export-box"><p style="font-weight:500; margin-bottom:8px;">📤 Exporta les 50 flashcards</p><p style="font-size:13px; color:#64748b; margin-bottom:8px;">Copia el text per importar a Quizlet (format: pregunta ⇥ resposta)</p><textarea readonly id="exportText">' + text + '</textarea><button class="btn btn-success" onclick="app.copiarExport()" style="background:#2b6e3b; color:white; border:none; padding:10px 24px; border-radius:40px; font-weight:600; margin-top:10px; cursor:pointer;">📋 Copiar</button><button class="btn btn-primary" onclick="app.baixarExport()" style="background:#1e3a5f; color:white; border:none; padding:10px 24px; border-radius:40px; font-weight:600; margin-top:10px; margin-left:8px; cursor:pointer;">⬇️ Baixa .txt</button></div>';
        },

        copiarExport: function() {
            var textarea = document.getElementById('exportText');
            textarea.select();
            document.execCommand('copy');
            alert('📋 Text copiat al porta-retalls!');
        },

        baixarExport: function() {
            var text = document.getElementById('exportText').value;
            var blob = new Blob([text], { type: 'text/plain;charset=utf-8' });
            var link = document.createElement('a');
            link.href = URL.createObjectURL(blob);
            link.download = 'tema35_flashcards_quizlet.txt';
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
            URL.revokeObjectURL(link.href);
        },

        // ============================================================
        //  EVENTS
        // ============================================================
        bindTabs: function() {
            var tabs = document.querySelectorAll('.tab-btn');
            for (var i = 0; i < tabs.length; i++) {
                tabs[i].addEventListener('click', function() {
                    var tabBtns = document.querySelectorAll('.tab-btn');
                    for (var j = 0; j < tabBtns.length; j++) {
                        tabBtns[j].classList.remove('active');
                    }
                    this.classList.add('active');
                    var contents = document.querySelectorAll('.tab-content');
                    for (var k = 0; k < contents.length; k++) {
                        contents[k].classList.remove('active');
                    }
                    var tabId = this.dataset.tab;
                    document.getElementById(tabId).classList.add('active');
                    app.currentTab = tabId;
                    if (tabId === 'flash') app.renderFlashcards();
                    if (tabId === 'export') app.renderExport();
                    if (tabId === 'resum') app.renderResum();
                    if (tabId === 'sim1') app.renderSimulacre(1);
                    if (tabId === 'sim2') app.renderSimulacre(2);
                    if (tabId === 'trampes') app.renderSimulacre(3);
                });
            }
        }
    };

    // Iniciar
    document.addEventListener('DOMContentLoaded', function() {
        app.init();
    });
    window.app = app;
</script>
</body>
</html>
